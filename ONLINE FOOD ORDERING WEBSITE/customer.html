<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Reviews - Foodie Express</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f8f8;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 20px;
            width: 50%;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        textarea {
            width: 90%;
            height: 100px;
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .btn {
            background: #ff5722;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn:hover {
            background: #e64a19;
        }
        .reviews {
            margin-top: 20px;
            text-align: left;
        }
        .review {
            background: #fff3e0;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Customer Reviews</h2>
        <form id="reviewForm">
            <textarea id="reviewText" placeholder="Write your review here..." required></textarea>
            <br>
            <button class="btn" type="submit">Submit Review</button>
        </form>
        <div class="reviews">
            <h3>Previous Reviews:</h3>
            <div class="review">🌟🌟🌟🌟🌟 - "Great food and fast delivery!"</div>
            <div class="review">🌟🌟🌟🌟 - "Loved the variety of dishes."</div>
            <div id="newReviews"></div>
        </div>
    </div>

    <script>
        const reviewForm = document.getElementById("reviewForm");
        const reviewInput = document.getElementById("reviewText");
        const reviewList = document.getElementById("newReviews");

        // Load reviews from localStorage on page load
        window.onload = () => {
            const savedReviews = JSON.parse(localStorage.getItem("reviews")) || [];
            savedReviews.reverse().forEach(review => displayReview(review));
        };

        // Add new review
        reviewForm.addEventListener("submit", function(e) {
            e.preventDefault();
            const text = reviewInput.value.trim();
            if (text === "") return;

            const review = `🌟🌟🌟🌟🌟 - "${text}"`;
            let reviews = JSON.parse(localStorage.getItem("reviews")) || [];

            // Keep only the last 3
            if (reviews.length >= 3) {
                reviews.shift(); // remove the oldest
            }

            reviews.push(review);
            localStorage.setItem("reviews", JSON.stringify(reviews));

            // Show the new one on top
            reviewList.innerHTML = ""; // Clear and reload
            reviews.slice().reverse().forEach(displayReview);

            reviewInput.value = "";
        });

        // Function to display a review
        function displayReview(text) {
            const div = document.createElement("div");
            div.className = "review";
            div.textContent = text;
            reviewList.appendChild(div);
        }
    </script>

</body>
</html>
