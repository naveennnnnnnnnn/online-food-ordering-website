<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up - Foodie Express</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f9f9f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    h2 {
      text-align: center;
      color: #ff512f;
    }

    .input-box {
      margin: 10px 0;
      display: flex;
      flex-direction: column;
    }

    .input-box input {
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: #ff512f;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 20px;
      transition: background-color 0.3s;
    }

    .btn:hover {
      background-color: #dd2476;
    }

    .footer {
      text-align: center;
      margin-top: 10px;
    }

    .footer a {
      text-decoration: none;
      color: #ff512f;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <h2>Sign Up</h2>
    <form id="signupForm">
        
      <div class="input-box">
        <input type="text" id="name" placeholder="Enter your name" required />
      </div>
      <div class="input-box">
        <input type="email" id="email" placeholder="Enter your email" required />
      </div>
      <div class="input-box">
        <input type="tel" placeholder="Enter your phone number" required>
    </div>
    <div class="input-box">
        <input type="date" placeholder="DOB" required>
    </div>
      <div class="input-box">
        <input type="password" id="password" placeholder="Enter password" required />
      </div>
      <div class="input-box">
        <label>Address</label>
        <textarea placeholder="Enter your full address" rows="3" required></textarea>
    </div> <div class="input-box">
        <label>Dietary Preferences</label>
        <select>
            <option>None</option>
            <option>Vegetarian</option>
            <option>Non-Vegetarian</option>
            <option>Vegan</option>
            <option>Gluten-Free</option>
        </select>
    </div>
    <div class="input-box">
        <label>Favorite Cuisine</label>
        <select>
            <option>North Indian</option>
            <option>South Indian</option>
           
            <option>Other</option>
        </select>
    </div>
      <button type="submit" class="btn">Sign Up</button>
    </form>
    <div class="footer">
      <p>Already have an account? <a href="los.html">Login</a></p>
    </div>
  </div>

  <script>
    document.getElementById('signupForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const users = JSON.parse(localStorage.getItem('users')) || [];
      users.push({ name, email, password });
      localStorage.setItem('users', JSON.stringify(users));

      alert("Signup successful! You can now login.");
      window.location.href = "los.html";
    });
  </script>

</body>
</html>
